[project]
name = "fourth-turn"
version = "0.1.0"
description = "The Fourth Turn — a RAG-over-PDF backend scaffold (ESSIR 2026 hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "qdrant-client>=1.12,<1.14",
    "pypdf>=4.2",
    # Local embeddings out of the box (intfloat/multilingual-e5-large). Pulls torch,
    # so the first install is large. Swap the model, or switch embedding_backend to
    # "provider", if you'd rather not carry it — see app/rag/embeddings.py.
    "sentence-transformers>=3.0",
    # litellm gives you one interface to ~100 hosted providers (OpenAI, Anthropic,
    # Gemini, Groq, ...). Ollama and LM Studio are reached directly over HTTP and do
    # not need it — remove it if you only run local models.
    "litellm>=1.44",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.2",
    "openai>=2.48.0",
]

# `uv sync` installs these too; `uv sync --no-dev` skips them (used in the Docker image).
[dependency-groups]
dev = ["ruff>=0.6"]

# Optional PDF extractors — install what you need:
#   uv sync --group pdfplumber    lightweight, layout-aware
#   uv sync --group pymupdf       fast, good balance
#   uv sync --group docling       IBM Research, heavy, excellent on complex layout
#   uv sync --group marker        GPU-accelerated, great for scans
#   uv sync --group all-extractors   installs everything
pdfplumber = ["pdfplumber>=0.10"]
pymupdf = ["PyMuPDF>=1.24"]
docling = ["docling>=2.0"]
marker-pdf = ["marker-pdf>=1.0"]
grobid = ["httpx>=0.27"]
all-extractors = [
    "pdfplumber>=0.10",
    "PyMuPDF>=1.24",
    "docling>=2.0",
    "marker-pdf>=1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
